version: 2
updates:
  # Checked daily, but a release is only proposed once it is 3 days old: the
  # same window pnpm enforces locally, long enough for a hijacked version to be
  # caught and pulled from npm before it can reach this project.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
