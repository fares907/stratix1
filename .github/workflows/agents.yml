name: Agents

# فريق STRATIX من الـ AI agents (فولدر agents/).
# - أي تعديل في agents/ لازم الاختبارات تعدّي.
# مواعيد الشغل: من 8 الصبح لـ 5 العصر بتوقيت القاهرة (عشان نفضل جوه الحدود المجانية)
# - 8:07 الصبح: كشّاف ← فحص الموقع ← اجتماع الصبح ← رسايل ← GitHub
# - 9 و11 و1 و3: يقرا الردود وينفّذ الموافقات
# - 4:43 العصر: اجتماع آخر اليوم ← التقرير اليومي
# المواعيد بتوقيت UTC (القاهرة +2 في الشتا و+3 في الصيف)، وGitHub ممكن يأخرها شوية.
# الموظفين بيدخلوا Supabase من غير أي مفتاح هنا: GitHub بيدّيهم توكن هوية (OIDC)
# والـ edge function "agents-gateway" بتتأكد إنه من الـ workflow ده على main.
# والموديلات من GitHub Models بالـ GITHUB_TOKEN (مجاني). أي مفتاح تاني في Secrets اختياري.
on:
  push:
    branches: [main]
    paths: ["agents/**", ".github/workflows/agents.yml"]
  pull_request:
    paths: ["agents/**", ".github/workflows/agents.yml"]
  schedule:
    - cron: "7 6 * * *"      # morning — 8:07 القاهرة
    - cron: "43 14 * * *"    # evening — 4:43 العصر
    - cron: "7 7-13/2 * * *" # inbox   — 9، 11، 1، 3
  workflow_dispatch:
    inputs:
      run:
        description: "أنهي تشغيل"
        type: choice
        options: [morning, evening, inbox, probe]
        default: morning

permissions:
  contents: read
  issues: write          # المطوّر بيفتح Issues
  pull-requests: write   # المراجِعة بتعلّق على PRs (مفيش merge)

concurrency:
  group: agents-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: agents

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: agents/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m stratix_agents check
      - run: python -m pytest -q

  dashboard:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agents/dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: agents/dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_TELEMETRY_DISABLED: "1"
      - run: pnpm audit --audit-level high

  run:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: agents-run
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write          # المطوّر بيفتح Issues
      pull-requests: write   # المراجِعة بتعلّق على PRs (مفيش merge)
      id-token: write        # توكن الهوية لـ agents-gateway
      models: read           # GitHub Models
    env:
      SUPABASE_GATEWAY_URL: https://frpqnfygixxolvpseqox.supabase.co/functions/v1/agents-gateway
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SITE_DATABASE_URL: ${{ secrets.SITE_DATABASE_URL }}
      AGENTS_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SITE_AUDIT_JSON: ${{ github.workspace }}/audit.json
    steps:
      - name: Pick the run
        id: pick
        working-directory: .   # قبل الـ checkout، فولدر agents لسه مش موجود
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT: ${{ inputs.run }}
        run: |
          case "$SCHEDULE" in
            "7 6 * * *") RUN=morning ;;
            "43 14 * * *") RUN=evening ;;
            "") RUN="${INPUT:-morning}" ;;
            *) RUN=inbox ;;
          esac
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.pick.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.pick.outputs.ready == 'true' && steps.pick.outputs.run == 'morning'
        uses: pnpm/action-setup@v6
      - name: Audit the site's dependencies
        if: steps.pick.outputs.ready == 'true' && steps.pick.outputs.run == 'morning'
        working-directory: .
        run: pnpm audit --json > audit.json || true
      - if: steps.pick.outputs.ready == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - if: steps.pick.outputs.ready == 'true'
        run: pip install -r requirements.txt
      - if: steps.pick.outputs.ready == 'true'
        run: python -m stratix_agents seed
      - if: steps.pick.outputs.ready == 'true'
        run: python -m stratix_agents ${{ steps.pick.outputs.run }}
