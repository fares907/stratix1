name: Agents

# فريق STRATIX من الـ AI agents (فولدر agents/).
# - أي تعديل في agents/ لازم الاختبارات تعدّي.
# - كل يوم الساعة 9:17 الصبح بتوقيت القاهرة الكشّاف بيدوّر على محلات جديدة.
#   مش هيشتغل غير لما تضيف SUPABASE_URL في Secrets.
on:
  push:
    branches: [main]
    paths: ["agents/**", ".github/workflows/agents.yml"]
  pull_request:
    paths: ["agents/**", ".github/workflows/agents.yml"]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: agents

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: agents/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m stratix_agents check
      - run: python -m pytest -q

  dashboard:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agents/dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: agents/dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_TELEMETRY_DISABLED: "1"
      - run: pnpm audit --audit-level high

  daily:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Skip until Supabase is configured
        id: gate
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL مش موجود في Secrets — مفيش تشغيل النهارده."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - if: steps.gate.outputs.ready == 'true'
        run: pip install -r requirements.txt
      - if: steps.gate.outputs.ready == 'true'
        run: python -m stratix_agents seed
      - if: steps.gate.outputs.ready == 'true'
        run: python -m stratix_agents scout
