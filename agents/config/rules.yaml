# قوانين الشركة — كل agent بيقراها في أول كل مهمة.
# عدّلها براحتك؛ الكود بيقرا أرقام الأسعار من هنا ويرفض أي رسالة بسعر برّاها.

company:
  name: STRATIX
  website: https://stratix.website
  what_we_do: تصميم وبرمجة مواقع للشركات والمحلات والمطاعم في مصر

targeting:
  city: بنها
  # الأسماء اللي ممكن المدينة تكون متسجلة بيها على OpenStreetMap
  city_osm_names: [Banha, Benha, بنها]
  # أنواع الأماكن اللي الكشّاف بيدوّر عليها (OpenStreetMap tags)
  amenity: [restaurant, cafe, fast_food, pharmacy, clinic, dentist, doctors]
  shop: any

pricing:
  currency: جنيه
  min: 2000
  max: 3000
  guidance: >
    موقع صفحة واحدة بسيط يبدأ من 2000 جنيه، وموقع أكبر فيه أكتر من صفحة
    يوصل لـ 3000 جنيه. ممنوع أي سعر تحت 2000 أو فوق 3000 من غير موافقة.

outreach:
  daily_limit: 15
  # الموظفين بيشتغلوا من 8 الصبح لـ 5 العصر بتوقيت القاهرة (المواعيد في .github/workflows/agents.yml)
  needs_approval: false   # الرسايل بتطلع أوتوماتيك
  unsubscribe_text: لو مش حابب نتواصل معاك تاني، رد بكلمة "إلغاء" ومش هنبعتلك تاني.

honesty:
  - لو مش متأكد من معلومة قول "مش متأكد" بوضوح.
  - ممنوع تألّف أسعار برّا القوانين، أو مواعيد تسليم، أو أعمال سابقة، أو أرقام.
  - ممنوع توعد العميل بحاجة مش مكتوبة في القوانين دي.
  - أي حاجة فيها فلوس برّا القوانين، أو ميعاد تسليم، أو خصم، تروح لصندوق الموافقات.

# الاشتراكات اللي رامي (مسؤول البنية) بيفكّرك بيها قبل ما تخلص.
# حط تاريخ التجديد الجاي لكل واحد (YYYY-MM-DD)، وحدّثه بعد ما تدفع.
# الدومين مش محتاج يتكتب هنا: رامي بيعرف تاريخه لوحده من RDAP.
subscriptions:
  - name: Railway
    note: استضافة الموقع
    renews_on:        # مثال: 2026-12-01
    remind_days: 7
