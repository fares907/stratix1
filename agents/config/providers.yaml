# المزوّدين — كلهم بواجهة OpenAI-compatible.
#
# الحدود هنا تقديرية: المزوّدين بيغيروا حدود الخطط المجانية من غير إنذار.
# الـ router بيلتزم بالأرقام دي، ولو المزوّد رجّع 429 بيوقف استخدامه للمدة اللي
# بيقولها (Retry-After) ويتحول للاحتياطي. عدّل الأرقام لما تعرف الحقيقية.
#
# أسماء الموديلات لازم تتأكد منها: `python -m stratix_agents models`
# بيسأل كل مزوّد عن الموديلات المتاحة فعلًا ويقولك أنهي اسم مش موجود.
#
# trains_on_free_data: المزوّد ممكن يستخدم البيانات في تحسين منتجاته على
# الخطة المجانية — الـ agents اللي sensitive مابتستخدموش.

providers:
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    trains_on_free_data: true
    models:
      pro:   { id: gemini-2.5-pro,   rpm: 5,  rpd: 100 }
      flash: { id: gemini-2.5-flash, rpm: 10, rpd: 250 }

  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    via_gateway: true   # المفتاح في Supabase Vault (GROQ_API_KEY)
    models:
      # الأسماء دي اتأكدنا منها من قائمة Groq نفسها (نوفمبر 2026)
      big:   { id: openai/gpt-oss-120b, rpm: 30, rpd: 1000 }
      small: { id: openai/gpt-oss-20b,  rpm: 30, rpd: 1000 }

  cerebras:
    base_url: https://api.cerebras.ai/v1
    api_key_env: CEREBRAS_API_KEY
    models:
      llama70b: { id: llama-3.3-70b, rpm: 30, rpd: 14400 }
      llama8b:  { id: llama3.1-8b,   rpm: 30, rpd: 14400 }

  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    trains_on_free_data: true
    models:
      llama70b: { id: "meta-llama/llama-3.3-70b-instruct:free", rpm: 20, rpd: 50 }
      coder:    { id: "qwen/qwen3-coder:free",                  rpm: 20, rpd: 50 }

  # Pollinations: مجاني ومن غير مفتاح خالص، بس رد واحد كل 45 ثانية، وممكن يحتفظ
  # بالبيانات، فهو آخر احتياطي للموظفين اللي مش sensitive بس.
  pollinations:
    base_url: https://text.pollinations.ai
    api_key_env: ""
    trains_on_free_data: true
    models:
      openai: { id: openai, rpm: 1, rpd: 300 }

# مفتاح Groq متخزّن في Supabase Vault؛ الـ agents بيوصلوله عن طريق agents-gateway.
# لو الأساسي والاحتياطي بتوع الموظف مش متاحين (مفيش مفتاح أو الحد خلص)،
# الـ router بيجرّب دول بالترتيب. البيانات الحساسة بتتخطى أي مزوّد trains_on_free_data.
last_resort: [groq:big, groq:small, pollinations:openai]
